# Copy to config.yaml and adjust.
# Relative paths are resolved against this file; ~ and $VARS are expanded.

# Root of the nested folder structure. Every directory that contains .git is a repo.
root: ~/work/gitlab

# origin must point to new_host. The URL of the old instance is derived by replacing only the
# host; scheme, user and project path stay the same.
new_host: gitlab.example.com
old_host: git.example.com

# Remote names
new_remote: origin      # new instance, the sync target
old_remote: git-old     # old instance, the sync source; added when missing

# Optional filters on the repo path relative to root (fnmatch globs, '*' also matches '/')
include: []
exclude: []
  # e.g. ["archive/*"]

# Branch names that are never synced in any repo (fnmatch globs)
exclude_branches: [dependabot*, renovate/*]

# true: a tag with the same name but a different target on both instances is overwritten on the
# new instance with the state of the old one (force push of that tag only).
# false: the difference is only reported. Protected tags on the new instance can reject the push.
overwrite_tags: true

# Jenkins builds on pushes to main on the new instance and creates commits and tags that can block
# the merge from the old instance. On a merge conflict on one of the branches below the tool checks
# locally whether the newest commits on the new instance were committed by Jenkins and whether the
# merge works once they are removed. It never changes anything itself; it writes copy and paste
# instructions (API: allow force push, git: rollback, merge, push, API: disallow force push) to
# instructions_file. The file is replaced on every run that has instructions.
jenkins_rollback:
  enabled: true
  committers: ["jenkins*"]   # case insensitive fnmatch globs on committer name or email
  branches: [main]
  max_commits: 50            # safety limit per branch
  instructions_file: jenkins_rollback.md

# A push that is rejected with "You are not allowed to push code to protected branches" adds the
# repo with a link to its protected branches settings to this file. The page path depends on the
# GitLab version.
protected_branches_file: protected_branches.md
protected_branches_page: "/-/settings/repository#js-protected-branches-settings"

# Audit: read only API checks. Nothing is changed on either instance; every result goes to the
# findings document. Runs in a dry run as well.
#   repositories: projects that exist on the old instance but not on the new one, and projects
#     whose archive status differs. Compares all projects the tokens can see; namespaces limits
#     this to the listed groups.
#   permissions: before anything is pushed, checks whether the user of the new instance token may
#     push to the protected branches that exist on the old instance.
#   project_objects: differences of pipeline schedules, feature flags (state and strategies) and
#     environments. Variable values are never written to the document, only their keys.
# Uses the tokens and connection settings of api_precheck below; read_api is enough on both sides.
audit:
  repositories: true
  permissions: true
  project_objects: true
  namespaces: []
    # e.g. [team-a, team-b/backend]

# API precheck: compares branches and tags of both instances through the GitLab API before any
# fetch and skips the repo when the old instance has nothing new. Tokens with scope read_api are
# read from environment variables, never from this file. If the check fails (missing token, network
# error, project not found) the repo gets a full sync.
api_precheck:
  enabled: true
  new_token_env: GITLAB_NEW_TOKEN
  old_token_env: GITLAB_OLD_TOKEN
  scheme: https
  timeout: 15

log_file: gitlab_sync.log

# One Markdown document with all findings of the run: audit results, merge conflicts, rejected
# pushes, Jenkins rollbacks, tag differences, errors and warnings. Replaced on every run, also in a
# dry run. Leave empty to disable.
findings_file: findings.md

# Branches that could not be merged are appended here, one line per branch and state.
conflicts_file: branch_conflicts.txt

# Performance tracking. Every git command and API request is timed; the run log ends with a report.
perf_file: performance.csv     # one row per repo and run, appended; leave empty to disable
perf_top: 10                   # number of slowest repos in the report
slow_command_seconds: 30       # single commands at or above this are logged as warnings, 0 disables

# true: do everything except pushing (same as --dry-run)
dry_run: false

# Check out the originally checked out branch again after each repo
restore_branch: true

# Timeout per git command in seconds
git_timeout: 600
