# Kopieren nach config.yaml und anpassen.
# Relative Pfade gelten relativ zu dieser Datei; ~ und $VARS werden aufgeloest.

# Wurzelverzeichnis mit der verschachtelten Ordnerstruktur (jedes Verzeichnis mit .git ist ein Repo)
root: ~/work/gitlab

# Hosts: origin muss auf new_host zeigen; die URL des alten GitLab entsteht,
# indem nur der Host durch old_host ersetzt wird (Pfad/Protokoll/User bleiben).
new_host: gitlab.example.com
old_host: git.example.com

# Remote-Namen
new_remote: origin      # neues GitLab (Ziel)
old_remote: git-old     # altes GitLab (Quelle), wird bei Bedarf angelegt

# Optionale Filter auf den Pfad relativ zu root (fnmatch-Globs, '*' matcht auch '/')
include: []
exclude:
  # - "archiv/*"

# Branch-Namen, die in allen Repos nicht gesynct werden (fnmatch-Globs, z.B. "wip/*")
exclude_branches: [dependabot*, renovate/*]

# true: Tags, die in beiden GitLabs gleich heissen, aber auf unterschiedliche Commits zeigen,
# werden im neuen GitLab mit dem Stand des alten ueberschrieben (Force-Push, alt -> neu).
# false: nur Warnung im Protokoll. Geschuetzte Tags im Ziel koennen den Push ablehnen.
overwrite_tags: true

# Jenkins baut bei Pushes auf main im neuen GitLab und erzeugt dabei Commits/Tags, die den Merge
# aus dem alten GitLab blockieren koennen. Bei einem Merge-Konflikt auf einem der Branches prueft das
# Tool (nur lesend/lokal), ob die obersten Commits im neuen GitLab von Jenkins stammen (COMMITTER) und
# ob der Merge nach deren Entfernung klappt. Das Tool veraendert dann NICHTS, sondern sammelt
# copy&paste-fertige Anweisungen (API: Force-Push erlauben, git: Rollback + Merge + Push, API: wieder
# verbieten) in instructions_file. Die Datei wird bei jedem Lauf mit Anleitungen neu geschrieben.
jenkins_rollback:
  enabled: true
  committers: ["jenkins*"]   # fnmatch-Globs (ohne Gross-/Kleinschreibung) auf Committer-Name oder -E-Mail
  branches: [main]
  max_commits: 50            # Sicherheitslimit pro Branch
  instructions_file: jenkins-rollback.md   # relativ zum Verzeichnis der log_file

# Wird ein Push auf einen geschuetzten Branch abgelehnt ("You are not allowed to push code to protected
# branches"), landet das Repo mit Link zur Seite "Protected branches" in dieser Datei (ohne Duplikate,
# relativ zum Verzeichnis der log_file). Der Seitenpfad haengt von der GitLab-Version ab.
protected_branches_file: protected_branches.md
protected_branches_page: "/-/settings/repository#js-protected-branches-settings"

# Vorabpruefung per GitLab-API (v4): fragt Branches/Tags beider Instanzen ab und ueberspringt
# das Repo komplett (kein fetch/checkout), wenn das alte GitLab nichts Neues hat.
# Tokens (Scope read_api) kommen aus Umgebungsvariablen, nie aus dieser Datei.
# Schlaegt die Pruefung fehl (Token fehlt, Fehler, Projekt nicht gefunden), laeuft der volle Sync.
api_precheck:
  enabled: true
  new_token_env: GITLAB_NEW_TOKEN
  old_token_env: GITLAB_OLD_TOKEN
  scheme: https
  timeout: 15

log_file: gitlab-sync.log

# Branches, die nicht automatisch gemerged werden konnten (Merge-Konflikt), werden hier angehaengt
# (eine Zeile pro Branch, ohne Duplikate bei gleichem Stand). Relativ zum Verzeichnis der log_file.
conflicts_file: branch_konflikts.txt

# true = alles ausser dem Push (auch per --dry-run auf der Kommandozeile)
dry_run: false

# Nach dem Sync pro Repo den urspruenglich ausgecheckten Branch wiederherstellen
restore_branch: true

# Timeout je git-Befehl in Sekunden
git_timeout: 600
